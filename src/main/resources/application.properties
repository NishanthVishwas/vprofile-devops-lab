
# JDBC Configuration for Database Connection
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://${DB_URL}
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

# Memcached Configuration - Active and Standby Hosts
memcached.active.host=${MEMCACHED_HOST}
memcached.active.port=11211
memcached.standBy.host=127.0.0.2
memcached.standBy.port=11211

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5671
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.ssl.algorithm=TLSv1.2
spring.rabbitmq.virtual-host=/

# Elasticsearch Configuration
elasticsearch.host=localhost
elasticsearch.port=9300
elasticsearch.cluster=vprofile
elasticsearch.node=vprofilenode

# File Upload Configuration
spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB

# Spring Security Configuration
spring.security.user.name=${APP_ADMIN_USERNAME}
spring.security.user.password=${APP_ADMIN_PASSWORD}
spring.security.user.roles=ADMIN

# MVC View Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.visualpathit.account.service.SecurityServiceImpl=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF

# Hibernate SQL Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable verbose logging
# logging.level.root=OFF
# logging.level.org.springframework.web=OFF
# spring.main.banner-mode=OFF
